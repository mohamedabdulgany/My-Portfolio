<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المشاريع | Mohamed Abdulghany</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00f2fe',
                            blue: '#4facfe',
                            purple: '#7f00ff',
                            dark: '#030712',
                            card: '#0b1329'
                        }
                    }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-brand-dark text-slate-100 font-['Cairo'] min-h-screen">

    <header class="border-b border-white/10 bg-brand-card/60 backdrop-blur-xl sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-brand-cyan"></span>
                <h1 class="font-black text-base sm:text-xl">لوحة إدارة طلبات المشاريع</h1>
            </div>

            <div class="flex items-center gap-3">
                <a href="index.html" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white/5 border border-white/10 hover:border-brand-cyan hover:text-brand-cyan transition">
                    العودة للبورتفوليو
                </a>
                <button id="logout-btn" type="button" class="hidden px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-red-500/10 text-red-300 border border-red-500/30 hover:bg-red-500/20 transition">
                    تسجيل الخروج
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-10 space-y-8">

        <!-- إعداد رابط الـ API وتسجيل الدخول -->
        <section id="login-section" class="max-w-md mx-auto bg-brand-card border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5">
            <div class="text-center space-y-1.5">
                <h2 class="text-2xl font-black">تسجيل دخول الأدمن</h2>
                <p class="text-slate-400 text-xs sm:text-sm">أدخل بيانات الدخول ورابط السيرفر لعرض طلبات العملاء</p>
            </div>

            <form id="login-form" novalidate class="space-y-4">
                <div>
                    <label for="api-base-url" class="block text-xs sm:text-sm font-semibold mb-1.5 text-slate-300">رابط الـ API</label>
                    <input type="url" id="api-base-url" required placeholder="https://your-service.onrender.com/api" class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-white/10 focus:border-brand-cyan outline-none transition text-sm text-white" dir="ltr">
                </div>

                <div>
                    <label for="admin-email" class="block text-xs sm:text-sm font-semibold mb-1.5 text-slate-300">البريد الإلكتروني</label>
                    <input type="email" id="admin-email" required placeholder="admin@example.com" class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-white/10 focus:border-brand-cyan outline-none transition text-sm text-white" dir="ltr">
                </div>

                <div>
                    <label for="admin-password" class="block text-xs sm:text-sm font-semibold mb-1.5 text-slate-300">كلمة المرور</label>
                    <input type="password" id="admin-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-white/10 focus:border-brand-cyan outline-none transition text-sm text-white" dir="ltr">
                </div>

                <button id="login-submit-btn" type="submit" class="w-full py-3.5 rounded-xl font-bold bg-gradient-to-r from-brand-cyan to-brand-blue text-slate-950 hover:shadow-[0_0_25px_rgba(0,242,254,0.45)] transition">
                    دخول
                </button>

                <p id="login-status" role="status" class="text-center text-xs sm:text-sm font-semibold hidden"></p>
            </form>
        </section>

        <!-- قسم عرض وإدارة الطلبات -->
        <section id="dashboard-section" class="hidden space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-4 bg-brand-card border border-white/10 rounded-2xl p-4 sm:p-5">
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" data-status-filter="" class="status-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-brand-cyan text-slate-950 transition">الكل</button>
                    <button type="button" data-status-filter="new" class="status-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white/5 text-slate-300 border border-white/10 hover:border-brand-cyan transition">جديد</button>
                    <button type="button" data-status-filter="contacted" class="status-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white/5 text-slate-300 border border-white/10 hover:border-brand-cyan transition">تم التواصل</button>
                    <button type="button" data-status-filter="archived" class="status-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white/5 text-slate-300 border border-white/10 hover:border-brand-cyan transition">مؤرشف</button>
                </div>

                <button id="refresh-btn" type="button" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white/5 border border-white/10 hover:border-brand-cyan hover:text-brand-cyan transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
                    <span>تحديث</span>
                </button>
            </div>

            <p id="dashboard-status" role="status" class="text-sm font-semibold text-slate-300 hidden"></p>

            <div id="inquiries-list" class="grid grid-cols-1 gap-4"></div>
        </section>

    </main>

    <script>
        const TOKEN_KEY = 'portfolio_admin_jwt_v1';
        const API_URL_KEY = 'portfolio_admin_api_url_v1';

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const loginStatus = document.getElementById('login-status');
        const loginSubmitBtn = document.getElementById('login-submit-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const dashboardStatus = document.getElementById('dashboard-status');
        const inquiriesList = document.getElementById('inquiries-list');
        const apiUrlInput = document.getElementById('api-base-url');
        const filterButtons = Array.from(document.querySelectorAll('.status-filter-btn'));

        let currentStatusFilter = '';

        function getSavedApiUrl() {
            const val = (apiUrlInput?.value || '').trim() || localStorage.getItem(API_URL_KEY) || '';
            return val.replace(/\/+$/, '');
        }

        function setLoginFeedback(msg, isError = false) {
            if (!loginStatus) return;
            loginStatus.textContent = msg;
            loginStatus.className = 'text-center text-xs sm:text-sm font-semibold ' + (isError ? 'text-red-400' : 'text-emerald-400');
        }

        function setDashboardFeedback(msg, isError = false) {
            if (!dashboardStatus) return;
            dashboardStatus.textContent = msg;
            dashboardStatus.className = 'text-sm font-semibold ' + (isError ? 'text-red-400' : 'text-emerald-400');
        }

        function showLoggedInUI() {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');
        }

        function showLoggedOutUI() {
            sessionStorage.removeItem(TOKEN_KEY);
            dashboardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            logoutBtn.classList.add('hidden');
            inquiriesList.innerHTML = '';
        }

        function formatDate(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            if (Number.isNaN(d.getTime())) return '';
            return d.toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
        }

        async function updateStatus(inquiryId, newStatus) {
            const baseUrl = getSavedApiUrl();
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!baseUrl || !token) return showLoggedOutUI();

            try {
                const res = await fetch(`${baseUrl}/inquiries/${encodeURIComponent(inquiryId)}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.status === 401 || res.status === 403) {
                    return showLoggedOutUI();
                }

                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.message || 'تعذر تحديث الحالة');
                }

                setDashboardFeedback('تم تحديث حالة الطلب بنجاح.', false);
                await loadInquiries();
            } catch (err) {
                setDashboardFeedback(err.message || 'حدث خطأ أثناء تحديث الحالة.', true);
            }
        }

        function renderInquiries(items) {
            inquiriesList.innerHTML = '';
            if (!Array.isArray(items) || items.length === 0) {
                inquiriesList.innerHTML = `
                    <div class="p-8 rounded-2xl bg-brand-card border border-white/10 text-center text-slate-400 text-sm">
                        لا توجد طلبات مشاريع مطابقة للفلتر الحالي.
                    </div>
                `;
                return;
            }

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'p-5 sm:p-6 rounded-2xl bg-brand-card border border-white/10 space-y-4';

                const topRow = document.createElement('div');
                topRow.className = 'flex flex-wrap items-start justify-between gap-3';

                const infoBox = document.createElement('div');
                infoBox.className = 'space-y-1';

                const nameEl = document.createElement('h3');
                nameEl.className = 'font-bold text-base sm:text-lg text-brand-cyan';
                nameEl.textContent = item.clientName || '';

                const emailEl = document.createElement('p');
                emailEl.className = 'text-xs sm:text-sm text-slate-300';
                emailEl.textContent = item.clientEmail || '';

                const dateEl = document.createElement('p');
                dateEl.className = 'text-xs text-slate-400';
                dateEl.textContent = formatDate(item.createdAt);

                infoBox.appendChild(nameEl);
                infoBox.appendChild(emailEl);
                infoBox.appendChild(dateEl);

                const statusSelect = document.createElement('select');
                statusSelect.className = 'px-3.5 py-2 rounded-xl bg-brand-dark border border-white/15 focus:border-brand-cyan outline-none text-xs sm:text-sm font-bold text-white';
                [
                    { value: 'new', label: 'جديد' },
                    { value: 'contacted', label: 'تم التواصل' },
                    { value: 'archived', label: 'مؤرشف' }
                ].forEach((opt) => {
                    const option = document.createElement('option');
                    option.value = opt.value;
                    option.textContent = opt.label;
                    if (item.status === opt.value) option.selected = true;
                    statusSelect.appendChild(option);
                });

                statusSelect.addEventListener('change', (e) => {
                    updateStatus(item.id, e.target.value);
                });

                topRow.appendChild(infoBox);
                topRow.appendChild(statusSelect);

                const detailsEl = document.createElement('p');
                detailsEl.className = 'p-4 rounded-xl bg-brand-dark/80 border border-white/5 text-sm text-slate-200 leading-relaxed whitespace-pre-line';
                detailsEl.textContent = item.projectDetails || '';

                card.appendChild(topRow);
                card.appendChild(detailsEl);
                inquiriesList.appendChild(card);
            });
        }

        async function loadInquiries() {
            const baseUrl = getSavedApiUrl();
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!baseUrl || !token) return showLoggedOutUI();

            setDashboardFeedback('جاري تحميل الطلبات...', false);
            try {
                const query = currentStatusFilter ? `?status=${encodeURIComponent(currentStatusFilter)}` : '';
                const res = await fetch(`${baseUrl}/inquiries${query}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (res.status === 401 || res.status === 403) {
                    return showLoggedOutUI();
                }

                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.message || 'تعذر جلب الطلبات');
                }

                dashboardStatus.classList.add('hidden');
                renderInquiries(data.inquiries || []);
            } catch (err) {
                setDashboardFeedback(err.message || 'حدث خطأ أثناء تحميل الطلبات.', true);
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const baseUrl = getSavedApiUrl();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            if (!baseUrl || !email || !password) {
                return setLoginFeedback('من فضلك أدخل رابط الـ API والبريد وكلمة المرور.', true);
            }

            loginSubmitBtn.disabled = true;
            loginSubmitBtn.textContent = 'جاري الدخول...';

            try {
                const res = await fetch(`${baseUrl}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.token) {
                    throw new Error(data.message || 'بيانات الدخول غير صحيحة');
                }

                localStorage.setItem(API_URL_KEY, baseUrl);
                sessionStorage.setItem(TOKEN_KEY, data.token);
                showLoggedInUI();
                await loadInquiries();
            } catch (err) {
                setLoginFeedback(err.message || 'تعذر تسجيل الدخول.', true);
            } finally {
                loginSubmitBtn.disabled = false;
                loginSubmitBtn.textContent = 'دخول';
            }
        });

        filterButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                currentStatusFilter = btn.getAttribute('data-status-filter') || '';
                filterButtons.forEach((b) => {
                    const active = b === btn;
                    b.className = active
                        ? 'status-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-brand-cyan text-slate-950 transition'
                        : 'status-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white/5 text-slate-300 border border-white/10 hover:border-brand-cyan transition';
                });
                loadInquiries();
            });
        });

        refreshBtn.addEventListener('click', loadInquiries);
        logoutBtn.addEventListener('click', showLoggedOutUI);

        const savedUrl = localStorage.getItem(API_URL_KEY);
        if (savedUrl && apiUrlInput) apiUrlInput.value = savedUrl;

        if (sessionStorage.getItem(TOKEN_KEY) && getSavedApiUrl()) {
            showLoggedInUI();
            loadInquiries();
        }
    </script>
</body>
</html>
